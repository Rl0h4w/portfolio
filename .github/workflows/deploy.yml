name: Publish portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        run: npm run build -- --outDir dist-pages
        env:
          PORTFOLIO_BASE: /portfolio/
      - name: Build for Aeza
        run: npm run build
        env:
          PORTFOLIO_BASE: /me/
      - name: Upload GitHub Pages bundle
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-pages
      - name: Upload Aeza bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-aeza
          path: dist
          if-no-files-found: error

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  aeza:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: aeza
      url: https://rlohaw.ru/me/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portfolio-aeza
          path: dist
      - name: Publish to Moscow VPS
        env:
          AEZA_SSH_HOST: ${{ secrets.AEZA_SSH_HOST }}
          AEZA_SSH_KEY: ${{ secrets.AEZA_SSH_KEY }}
          AEZA_SSH_HOST_KEY: ${{ secrets.AEZA_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export AEZA_SSH_KEY_FILE="$RUNNER_TEMP/portfolio_key"
          export AEZA_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/portfolio_known_hosts"
          trap 'unlink "$AEZA_SSH_KEY_FILE"; unlink "$AEZA_SSH_KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$AEZA_SSH_KEY" > "$AEZA_SSH_KEY_FILE"
          printf '%s\n' "$AEZA_SSH_HOST_KEY" > "$AEZA_SSH_KNOWN_HOSTS_FILE"
          unset AEZA_SSH_KEY AEZA_SSH_HOST_KEY
          bash scripts/publish-aeza.sh dist
      - name: Verify public pages and résumés
        run: |
          set -euo pipefail
          for file in index.html ru/index.html cv.pdf cv-en.pdf sitemap.xml \
            google7b61c5e3d4c8d7f4.html ru/case/context/index.html \
            ru/case/underwater/index.html ru/case/dataknowledge/index.html; do
            route="${file%index.html}"
            curl --fail --silent --show-error --max-time 15 \
              "https://rlohaw.ru/me/${route}?release=$GITHUB_SHA" |
              python3 -c 'import sys; from pathlib import Path; actual = sys.stdin.buffer.read(); expected = Path(sys.argv[1]).read_bytes(); sys.exit(0 if actual == expected else f"Published content differs: {sys.argv[1]}")' "dist/$file"
          done
